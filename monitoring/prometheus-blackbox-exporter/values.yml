# 配置 Service 类型为 NodePort
service:
  type: NodePort
  port: 9115
  # 可选：指定固定的 NodePort 端口 (范围需在 30000-32767 之间)
  # nodePort: 30915

# Blackbox Exporter 的探测模块配置 (示例)
config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: []  # 默认接受 2xx
        method: GET
        preferred_ip_protocol: "ip4"
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: "ip4"
    icmp:
      prober: icmp
      timeout: 5s
      icmp:
        preferred_ip_protocol: "ip4"
